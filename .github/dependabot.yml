version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /apps/linux
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    allow:
      - dependency-type: all
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /apps/windows
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
