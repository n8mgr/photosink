[package]
changelog = "CHANGELOG.md"
assets = "release/photosink_*"
versioned_files = [
    "Cargo.toml",
    "bridge/Cargo.toml",
    "apps/linux/Cargo.toml",
    { path = "Cargo.lock", dependency = "photosink" },
    { path = "Cargo.lock", dependency = "photosink-bridge" },
    { path = "apps/linux/Cargo.lock", dependency = "photosink" },
    { path = "apps/linux/Cargo.lock", dependency = "photosink-bridge" },
    { path = "apps/linux/Cargo.lock", dependency = "photosink-gtk" },
    { path = "apps/macos/Resources/Info.plist", regex = '<key>CFBundleShortVersionString</key>\s*<string>(?<version>[^<]+)</string>' },
    { path = "apps/windows/Photosink.csproj", regex = '<Version>(?<version>[^<]+)</Version>' },
]

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "master"

[workflows.steps.title]
template = "chore: prepare release $version"
variables = { "$version" = "Version" }

[workflows.steps.body]
template = "This PR was created automatically. Merging it will build and sign the apps, then tag $version and publish the release.\n\n$changelog"
variables = { "$changelog" = "ChangelogEntry", "$version" = "Version" }

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "n8mgr"
repo = "photosink"
